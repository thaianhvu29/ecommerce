name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'ENV'
          JWT_SECRET=ci-only-secret
          ENV

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Show Compose services
        run: docker compose config --services

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . \
            -path './node_modules' -prune \
            -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  frontend-check:
    name: Frontend Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: /api

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - compose-validation
      - backend-check
      - frontend-check

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --tag ecommerce-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --tag ecommerce-frontend:${{ github.sha }} \
            ./frontend

      - name: Show built images
        run: |
          docker image ls \
            ecommerce-backend:${{ github.sha }} \
            ecommerce-frontend:${{ github.sha }}
